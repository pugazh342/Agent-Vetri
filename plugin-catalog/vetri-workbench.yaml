description: The Vetri desktop app in your browser. `vetri workbench` serves the desktop interface through the Vetri dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `vetri workbench` run and again after each Vetri update it runs `npm install --ignore-scripts` (guided by Vetri's lockfile) and Vite against your Vetri checkout's desktop sources, writing only under ~/.vetri/vetri-workbench and its own plugin dir (the checkout is only read), and starts `vetri dashboard` on loopback when none is running.
maintainer: sxuff
