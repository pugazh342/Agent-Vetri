name: mnemostack
repo: https://github.com/udjin-labs/vetri-mnemostack
sha: 08bdc8c4bc78501eaa4297978082ff380bff4658
subdir: src/vetri_mnemostack/plugin
description: Persistent agent memory over a mnemostack service or a local Qdrant — hybrid
  recall (vector + lexical + graph), verbatim capture with self-echo suppression, and
  soft retraction. Multi-tenant when pointed at a shared authenticated service; the
  tenant is resolved server-side from the service key. Disclosure — the pinned directory
  is a discovery shim; the provider code installs from PyPI at the version pinned in
  plugin.yaml pip_dependencies (vetri-mnemostack==1.0.3) into the Vetri venv.
  Configured via MNEMOSTACK_* env vars; no key is required for a purely local
  Qdrant setup.
maintainer: udjin-labs
tier: community
category: memory
requires_vetri: ">=0.1.0"
docs_url: https://github.com/udjin-labs/vetri-mnemostack/blob/08bdc8c4bc78501eaa4297978082ff380bff4658/README.md
version: '1.0.3'
capabilities:
  provides_tools:
    - mnemostack_search
    - mnemostack_remember
    - mnemostack_forget
  provides_hooks: []
  provides_middleware: []
  requires_env: []
