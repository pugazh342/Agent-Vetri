description: "NetMind OpenAI-compatible model provider with a bundled model catalog. Disclosure — registers one model provider at import and nothing else (no tools, hooks, commands or threads); chat requests go to https://api.netmind.ai/inference-api/v1 through Vetri' own client with NETMIND_API_KEY, which Vetri reads; the plugin itself opens no connections, reads and writes no files and starts no processes."
maintainer: NetMind-AI
tier: community
category: models
requires_vetri: ">=0.1.0"
version: "1.0.0"
docs_url: https://github.com/NetMind-AI/netmind-vetri-provider#readme
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - NETMIND_API_KEY
